name: CI

# Branches only: a version tag runs deploy.yml, which runs the same checks before it deploys.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, browser check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install the browser for the browser check
        run: npx playwright install --with-deps chromium
      - name: Browser check (builds the site first)
        run: npm run test:e2e
      - name: Build, with no warnings
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qiE '\(!\)|warn' build.log; then echo "::error::The build printed a warning"; exit 1; fi
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install commitizen
      - name: cz check over the branch's commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git merge-base origin/main HEAD)"; fi
          cz check --rev-range "$base..HEAD"
