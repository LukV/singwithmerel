name: OIDC refusal check (temporary)
on:
  push:
    branches: ['block/**']
permissions:
  contents: read
  id-token: write
jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: A branch must not be able to assume the deploy role
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Refused?
        run: |
          echo "assume outcome: ${{ steps.assume.outcome }}"
          test "${{ steps.assume.outcome }}" = failure
